name: Test and Quality Check

# The working branch is master. These used to name main and develop, neither of
# which exists here, so this workflow had never run: every gate below was
# decorative while the build workflow — triggered by tags — was the only thing
# that fired.
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7.4.10-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        cache: true

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'yarn'
        cache-dependency-path: booksdump-frontend/yarn.lock

    - name: Verify dependencies
      run: go mod verify

    # Same entry point developers run locally: bootstrap, frontend deps,
    # frontend tests, production frontend build, then the Go build and tests.
    - name: Verify
      run: make verify

    - name: Run go vet
      run: go vet ./...

    - name: Install staticcheck
      run: go install honnef.co/go/tools/cmd/staticcheck@2026.1

    - name: Run staticcheck
      run: staticcheck ./...

    # Gated on new code only. The repository carries a large backlog of findings
    # from the years the lint config was unparseable and therefore never ran;
    # this keeps new code clean without blocking on that backlog.
    - name: Run golangci-lint on new code
      uses: golangci/golangci-lint-action@v9.3.0
      with:
        version: v2.12.2
        args: --new-from-merge-base=origin/${{ github.base_ref || 'master' }}

    # ESLint cannot report only the new lines, so a changed file is linted
    # whole. Severity carries the distinction instead: errors block, warnings
    # are the backlog inherited from the years the frontend had no linter.
    - name: Run ESLint on changed frontend files
      run: make lint-frontend-new
      env:
        LINT_BASE: origin/${{ github.base_ref || 'master' }}

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.out
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    # gosec type-checks the packages, so the generated inputs have to exist
    # first: assets.go embeds the frontend build directory, and without it
    # nothing compiles.
    - name: Prepare generated inputs
      run: make bootstrap

    # Through make so the flags cannot drift from what runs locally: the
    # frontend's node_modules carries a Go file of its own, and suppressions
    # are required to carry a justification.
    - name: Run Gosec Security Scanner
      run: make security

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
