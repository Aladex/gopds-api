# Migrated from the golangci-lint v1 format with `golangci-lint migrate`.
# The previous config had been unparseable for a long time: it still used
# skip-dirs/skip-files, govet.check-shadowing and the golint/maligned/deadcode
# linters, all removed during the v1 series, so linting could not run at all.
version: "2"
run:
  issues-exit-code: 1
  tests: true
linters:
  enable:
    - bodyclose
    - depguard
    - dogsled
    - dupl
    - exhaustive
    - funlen
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - lll
    - misspell
    - mnd
    - nakedret
    - noctx
    - nolintlint
    - staticcheck
    - unconvert
    - unparam
    - whitespace
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: github.com/sirupsen/logrus
              desc: Use standard log package or structured logging
    dupl:
      threshold: 100
    goconst:
      min-len: 2
      min-occurrences: 2
    gocritic:
      disabled-checks:
        - dupImport
        - ifElseChain
        - octalLiteral
        - whyNoLint
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    gocyclo:
      min-complexity: 15
    govet:
      enable:
        - shadow
    lll:
      line-length: 140
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Tests deliberately repeat literals, embed obviously fake credentials as
      # fixtures, and are long and repetitive where that keeps them readable.
      - linters:
          - dupl
          - funlen
          - goconst
          - gocyclo
          - gosec
          - mnd
        path: _test\.go
      # go-pg resolves the tableName marker field through reflection, so the
      # unused linter cannot see the reference.
      - linters:
          - unused
        text: field tableName is unused
    paths:
      - .*\.pb\.go$
      - vendor
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - gopds-api
  exclusions:
    generated: lax
    paths:
      - .*\.pb\.go$
      - vendor
      - third_party$
      - builtin$
      - examples$
